<style>
/* Layout: colonne unique de 560px max, bandeau mois en haut, barre d'onglets fixe en bas, feuilles modales par le bas. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#15231F; --muted:#5C6C66; --line:#DCE3DF;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --ok:#1E7F4F; --warn:#A8690F; --bad:#B3372B; --bad-soft:#F7E2DE; --warn-soft:#F8EBD3;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1715; --surface:#16221F; --ink:#E6EFEB; --muted:#93A59E; --line:#26362F;
    --accent:#3CC2A6; --accent-ink:#04231C; --accent-soft:#1B3A33;
    --ok:#5BD08F; --warn:#E2B04E; --bad:#F08B7E; --bad-soft:#3A201C; --warn-soft:#3A2F15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#16221F; --ink:#E6EFEB; --muted:#93A59E; --line:#26362F;
  --accent:#3CC2A6; --accent-ink:#04231C; --accent-soft:#1B3A33;
  --ok:#5BD08F; --warn:#E2B04E; --bad:#F08B7E; --bad-soft:#3A201C; --warn-soft:#3A2F15;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:17px;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
html{height:100%;-webkit-text-size-adjust:100%}
nav.tabs,#sheetbg,#toast{transform:translateZ(0);-webkit-transform:translateZ(0)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .app{font-family:var(--font-display);font-weight:700;font-size:20px}
.catbar{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px}.catbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:500}.catbar button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.catbar button span{opacity:.6;margin-left:4px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthnav button{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink)}
.monthnav button:active{background:var(--accent-soft)}
.monthnav span{min-width:100px;text-align:center;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(20,40,34,.05),0 6px 18px -10px rgba(20,40,34,.18)}
.hero{background:linear-gradient(145deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 72%,#000) 100%);color:var(--accent-ink);border:0;gap:6px;border-radius:24px;padding:20px 18px;box-shadow:0 14px 30px -16px color-mix(in srgb,var(--accent) 80%,#000)}
.hero .lbl{font-size:13px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1.05;letter-spacing:-.01em}
.hero .sub{font-size:13px;opacity:.85}
.hero input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:var(--accent-ink);border-radius:10px;padding:8px 10px;width:150px;text-align:right}
.hero input::placeholder{color:var(--accent-ink);opacity:.6}
.soldebox{display:block;margin:6px 0 4px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.soldebox .sl{display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.soldebox .sin{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.soldebox .sin input{flex:1;width:auto;min-width:0;font-size:24px;font-weight:700;text-align:left;background:rgba(255,255,255,.2);padding:8px 12px}
.soldebox .sin b{font-size:22px}
.soldebox .sh{display:block;font-size:12px;opacity:.8;line-height:1.35}
.herorow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent-ink);border-radius:999px;opacity:.95}
.aside2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px}.aside2>div{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}.aside2 span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;min-height:32px}.aside2 b{display:block;margin-top:4px;font-size:21px}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.hstats>div{background:rgba(0,0,0,.14);border-radius:14px;padding:9px 12px}.hstats b{display:block;font-size:16px;font-weight:700}.hstats span{font-size:12px;opacity:.85}
.mv{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line)}.mv:first-child{border-top:0}
.dt{width:52px;text-align:center;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 0;flex:none}
.mv .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.env .st{font-size:12.5px;font-weight:600}.env .st.warn{color:var(--warn)}.env .st.bad{color:var(--bad)}.env .st.ok{color:var(--muted);font-weight:500}
.amtbig{text-align:center;padding:6px 0 2px}.amtbig .l{font-size:13px;color:var(--muted)}
.amtbig input{width:100%;border:0;background:none;text-align:center;font-family:var(--font-display);font-weight:700;font-size:48px;letter-spacing:-.01em;color:var(--ink);padding:0}
.amtbig input:focus{outline:none}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:52px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font-size:22px;font-weight:500}
.keys button:active{background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px}
.pills button.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.swrow{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:44px}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked + i{background:var(--accent)}.sw input:checked + i::after{transform:translateX(22px)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.rowbtn{background:none;border:0;text-align:left;padding:0;flex:1;min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on svg{opacity:1}

.env{display:block;padding:8px 0;border-top:1px solid var(--line)}
.env>.bar{margin-top:6px}
.env:first-child{border-top:0}
button.env{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;cursor:pointer}button.env:first-child{border-top:0}
.env .h{display:flex;justify-content:space-between;gap:8px}
.bar{display:block;width:100%;height:10px;min-height:10px;flex:none;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:10px;min-width:0;background:var(--accent);border-radius:999px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;transition:transform .08s ease,opacity .15s;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:999px}
.btn:active{transform:scale(.97)}
.rowbtn:active{opacity:.6}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.info{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px}
.info.bad{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv.tot{border-top:1px solid var(--line);font-weight:600;margin-top:4px;padding-top:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:560px;pointer-events:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;padding:4px 6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;color:var(--muted);min-width:0;border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on:not(.add){background:var(--accent-soft)}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.add span.pl{background:var(--accent);color:var(--accent-ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-top:-16px;box-shadow:0 6px 14px -4px color-mix(in srgb,var(--accent) 70%,#000)}
nav.tabs button.add{color:var(--ink)}

.top .app .help{display:inline-grid;vertical-align:middle}
.top .app.tt{font-size:15px;line-height:1.15;white-space:nowrap}
.help{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:15px;display:grid;place-items:center;padding:0;flex:none;margin-left:2px}
.wiz{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.wiz .dots{display:flex;gap:5px}.wiz .dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.wiz .dots i.on{background:var(--accent)}
.wiz p{margin:6px 0}
.wrow{display:grid;grid-template-columns:1fr 92px 54px 38px;gap:6px;align-items:center;margin:6px 0}
.wrow.head{font-size:11.5px;color:var(--muted);margin-bottom:0}
.wrow.env{grid-template-columns:30px 1fr 84px 38px}
.wrow.pk{grid-template-columns:1fr 100px 38px}
.wrow.ac{grid-template-columns:1fr 104px 84px 38px}
.wrow input,.wrow select{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:16px}
.wrow input[type=checkbox]{width:22px;height:22px;padding:0}
.chkl input,.chkl2 input{width:22px;height:22px;accent-color:var(--accent)}
.chkl2{display:flex;gap:10px;align-items:center;font-weight:600}
.wnav{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
.hsec{border-top:1px solid var(--line);padding:10px 0}
.hbody p{margin:7px 0;font-size:14.5px}
body.wiz nav.tabs{display:none}
body.wiz{padding-bottom:30px}
#sheetbg{position:fixed;inset:0;height:100dvh;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;z-index:50;max-width:90%}
.empty{padding:18px 12px;color:var(--muted);font-size:14px;text-align:center;border:1px dashed var(--line);border-radius:14px;margin:6px 0}
.dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;font-family:var(--font-display)}
.dot.s{width:10px;height:10px;display:inline-block;margin-right:7px;vertical-align:baseline}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{background:var(--bg);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;color:var(--muted)}.tile b{font-size:15.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line)}.split i{display:block;height:100%}
@keyframes sheetup{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#sheetbg{animation:fadein .18s ease-out}#sheet{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}
#sheet::before{content:"";align-self:center;flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px 0 2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockin{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lockt{font-family:var(--font-display);font-weight:700;font-size:26px}
#lockmsg{color:var(--muted);font-size:14px;min-height:20px}#lockmsg.bad{color:var(--bad)}
.dots{display:flex;gap:12px;min-height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:72px;width:72px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-family:var(--font-display);font-weight:600;display:grid;place-items:center}
.pad button:active{background:var(--accent-soft)}.pad button.ok{background:var(--accent);color:var(--accent-ink);border:0}
.pad button svg{width:26px;height:26px}
body.priv #main,body.priv #tabs{visibility:hidden}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.gear svg{width:20px;height:20px}
.topr{display:flex;align-items:center;gap:8px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;color:var(--ink)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex:none;text-transform:uppercase}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block}
</style>


</head>
<body>
<div class="wrap" id="main"></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div id="lock" hidden><div class="lockin"><div class="lockt">Les comptes en poches</div><div id="lockmsg">Entrez votre code</div><div class="dots" id="lockdots"></div>
  <div class="pad" id="lockpad"></div><div id="lockextra" class="btns" style="justify-content:center"></div></div></div>
<div id="sheetbg" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============ Constantes ============ */
const KEY = "mes-comptes-perso-v1";
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC = ["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
const TYPES = ["Dépense","Revenu","Versement sur Livret A","Retrait du Livret A","Avance (à rembourser)"];
const TYPE_SHORT = {"Dépense":"Dépense","Revenu":"Revenu","Versement sur Livret A":"Vers. Livret A","Retrait du Livret A":"Retrait Livret A","Avance (à rembourser)":"Avance"};
const CATS_EXC = ["Impôts","Santé","Voiture","Maison / travaux","Enfants","Cadeaux","Vacances","Autre","Remboursement","Envois LIVRET A"];

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const isNum = v => typeof v === "number" && isFinite(v);

  if (SEC.pin.length < 4) return;
  const ok = await unlockPin(SEC.pin);
  if (ok) return hideLock();
  SEC.cfg.fails++; if (SEC.cfg.fails >= 5) SEC.cfg.until = Date.now() + Math.min(600, 15 * Math.pow(2, SEC.cfg.fails - 5)) * 1000; secCfgSave();

const ckey = (m,y) => y + "-" + pad(m+1);
const cutsOf = () => (S && S.cuts) || {};
const nextMY = (m,y) => m === 11 ? {m:0,y:y+1} : {m:m+1,y};

function defRange(m,y){ const P = payday(), iso = (yy,mm,dd) => yy + "-" + pad(mm+1) + "-" + pad(dd);
  if (P === 1) return [iso(y,m,1), iso(y,m,new Date(y,m+1,0).getDate())];
  const d0 = new Date(y,m-1,1); return [iso(d0.getFullYear(), d0.getMonth(), P), iso(y,m,P-1)]; }
function periodRange(m,y){ const r = defRange(m,y), c = cutsOf(), n = nextMY(m,y);
  if (c[ckey(m,y)]) r[0] = c[ckey(m,y)];
  if (c[ckey(n.m,n.y)]) r[1] = isoAdd(c[ckey(n.m,n.y)], -1);
  return r; }
function periodOf(iso){ const P = payday(); let y = +iso.slice(0,4), m = +iso.slice(5,7) - 1; if (P > 1 && +iso.slice(8,10) >= P){ m++; if (m > 11){ m = 0; y++; } }
  const c = cutsOf(), n = nextMY(m,y);
  if (c[ckey(n.m,n.y)] && iso >= c[ckey(n.m,n.y)]) return n;
  if (c[ckey(m,y)] && iso < c[ckey(m,y)]) return prevMY(m,y);
  return {m,y}; }
const curPeriod = () => periodOf(todayIso());
function fixDate(jour,m,y){ const P = payday(); let mm = m, yy = y; if (P > 1 && jour >= P){ mm = m - 1; if (mm < 0){ mm = 11; yy--; } } return new Date(yy, mm, Math.min(jour, new Date(yy,mm+1,0).getDate())); }
function inMonth(j,m,y){ const r = periodRange(m,y); return j.date >= r[0] && j.date <= r[1]; }
function fixCalc(rows,m,y){
  const nj = new Date(y,m+1,0).getDate(); const today = new Date(); today.setHours(0,0,0,0);
  let prevu = 0, passe = 0;
  for (const r of rows){
    const c = r.m[m], d = N(r.montant);
    prevu += isNum(c) ? c : d;
    const fut = r.jour ? fixDate(r.jour,m,y) > today : false;
    const got = r.got && r.got[y*12+m];
    if (c === "x") passe += d; else if (isNum(c) && (!fut || got)) passe += c;
  }
  return {prevu, passe};
}
function fixState(r,m,y){
  const c = r.m[m]; const nj = new Date(y,m+1,0).getDate(); const today = new Date(); today.setHours(0,0,0,0);
  const dp = r.jour ? fixDate(r.jour,m,y) : null;
  if (c === "x") return {k:"ok", t:"pointé", amt:N(r.montant)};
  if (isNum(c) && r.got && r.got[y*12+m]) return {k:"ok", t:"reçu (montant réel)", amt:c};
  if (isNum(c)) return dp && dp > today ? {k:"wait", t:"à venir (montant saisi)", amt:c} : {k:"ok", t:"pointé (montant saisi)", amt:c};
  if (!dp) return {k:"wait", t:"à venir", amt:N(r.montant)};
  return dp < today ? {k:"late", t:"à pointer", amt:N(r.montant)} : {k:"wait", t:"à venir", amt:N(r.montant)};

function calc(m,y){

  const envs = S.settings.envelopes.map(e => {
    const bud = isNum(e.m[m]) ? e.m[m] : N(e.b);
    const dep = sum(j => j.type === "Dépense" && j.cat === e.n);
    return {n:e.n, bud, dep, reste:bud-dep};

  const revExc = sum(j => j.type === "Revenu");
  const depEpargne = sum(j => j.type === "Dépense" && j.cat === "Épargne");
  const depJournal = sum(j => j.type === "Dépense") - depEpargne;
  const vers = sum(j => j.type === "Versement sur Livret A"), ret = sum(j => j.type === "Retrait du Livret A");
  const epargne = vers - ret + depEpargne;
  const solde = S.settings.solde;
  let cD11 = 0, cD12 = 0, cD13 = 0, cD14 = 0, cD15 = 0;
  let d11 = Math.max(0, rev.prevu - rev.passe);
  const avances = live().filter(j => j.type === "Avance (à rembourser)" && !j.remb && j.pointe === "x").reduce((a,j) => a + N(j.montant), 0);
  let d12 = sum(j => j.type === "Revenu" && j.pointe !== "x") + avances;
  let d13 = Math.max(0, ch.prevu - ch.passe);
  let d14 = sum(j => j.type === "Dépense" && j.pointe !== "x");
  let d15 = sum(j => j.type === "Versement sur Livret A" && j.pointe !== "x") - sum(j => j.type === "Retrait du Livret A" && j.pointe !== "x");
  let carry = 0;
  if (cutsOf()[ckey(m,y)]){ const pv = prevMY(m,y), PJ = live().filter(j => inMonth(j,pv.m,pv.y)), ps = (f) => PJ.filter(f).reduce((a,j) => a + N(j.montant), 0);
    const pr = fixCalc(S.fixRev,pv.m,pv.y), pc = fixCalc(S.fixCh,pv.m,pv.y);
    cD11 = Math.max(0, pr.prevu - pr.passe); cD12 = ps(j => j.type === "Revenu" && j.pointe !== "x");
    cD13 = Math.max(0, pc.prevu - pc.passe); cD14 = ps(j => j.type === "Dépense" && j.pointe !== "x");
    cD15 = ps(j => j.type === "Versement sur Livret A" && j.pointe !== "x") - ps(j => j.type === "Retrait du Livret A" && j.pointe !== "x");

    revenus: rev.prevu + revExc, depenses: ch.prevu + depJournal, resultat: rev.prevu + revExc - ch.prevu - depJournal - epargne };
}
function livretCalc(){
  const e = S.epargne, dep = e.dateDepart || "0000-00-00", low = x => String(x || "").trim().toLowerCase();
  const moves = [], manuel = e.manuel.filter(m => !m.del);
  for (const m of manuel){ const pq = String(m.pq || ""); const vers = /^Versement/.test(pq) || pq === "Ajustement (+)";
    moves.push({id:m.id, kind:"S", date:m.date || todayIso(), lib:m.lib, vers:vers ? N(m.montant) : 0, ret:vers ? 0 : N(m.montant),
      org:/^Ajustement/.test(pq) ? "Ajustement" : vers ? "Versement" : pq === "Grosse dépense" ? "Grosse dépense" : "Poche " + pq}); }
  for (const j of live()){
    if (j.pointe !== "x" || !(j.date > dep)) continue;
    const env = j.type === "Dépense" && (j.cat === e.envA || (e.envB && j.cat === e.envB) || j.cat === "Envois LIVRET A");
    const v = env || j.type === "Versement sur Livret A", r = j.type === "Retrait du Livret A";
    if (!v && !r) continue;
    moves.push({id:j.id, kind:"J", date:j.date, lib:j.lib, vers:v ? N(j.montant) : 0, ret:r ? N(j.montant) : 0,
      org:env ? (j.cat === "Envois LIVRET A" ? "Envoi depuis Mois" : "Enveloppe " + j.cat) : r ? "Vers compte courant" : "Depuis compte courant"}); }
  for (const f of e.futur){ if (f.fait === "x" && (N(f.sortie) || N(f.entree)))
    moves.push({id:f.id, kind:"F", date:f.date || todayIso(), lib:f.lib, vers:N(f.entree), ret:N(f.sortie), org:"FUTUR"}); }
  const solde = N(S.settings.livretDepart) + moves.reduce((a,m) => a + m.vers - m.ret, 0);
  const poches = e.poches.filter(p => p.n).map(p => {
    const mis = N(p.f) + live().filter(j => j.type === "Dépense" && j.cat === "Envois LIVRET A" && low(j.lib) === low(p.n) && j.pointe === "x" && j.date > dep).reduce((a,j) => a + N(j.montant), 0);
    const util = manuel.filter(m => low(m.pq) === low(p.n)).reduce((a,m) => a + N(m.montant), 0);
    return {id:p.id, n:p.n, mis, util, reste:mis - util}; });
  const pochesReste = poches.reduce((a,p) => a + p.reste, 0), aMoi = solde - pochesReste;
  const sorties = e.futur.filter(f => f.fait !== "x").reduce((a,f) => a + N(f.sortie), 0);
  const entrees = e.futur.filter(f => f.fait !== "x").reduce((a,f) => a + N(f.entree), 0);
  return {solde, moves, poches, pochesReste, aMoi, entrees, sorties, prevu:aMoi + entrees - sorties};
}

  if (!J && !P && !F) throw new Error("Feuilles « Journal », « Paramètres » et « Fixes » introuvables.");

  if (P){
    for (let r=6; r<=22; r++){

      const m = []; for (const c of "GHIJKLMNOPQR"){ const v = cell(P,c+r); m.push(isNum(v) ? v : null); }

  }

    for (let r=r1; r<=r2; r++){
      const n = cell(ws,"B"+r); if (n === undefined || String(n).trim() === "") continue;
      const m = []; for (const c of cols){ const v = cell(ws,c+r); m.push(isNum(v) ? v : (String(v ?? "").trim().toLowerCase() === "x" ? "x" : "")); }
      const j = cell(ws,"E"+r);
      rows.push({id:uid(), n:String(n).trim(), t:String(cell(ws,"C"+r) ?? "").trim(), montant:N(cell(ws,"D"+r)), jour:isNum(j) ? j : null, m});
    } return rows; };

    for (let r=5; r<=Math.min(ref,5000); r++){

      const iso = anyToIso(dt); if (!iso) continue;

        montant:mt, pointe:String(cell(J,"G"+r) ?? "").trim().toLowerCase() === "x" ? "x" : "", note:String(cell(J,"H"+r) ?? ""),
        remb: rem ? anyToIso(rem) : "", upd:0};

function mergeJournal(incoming){
  const byId = new Map(S.journal.map(j => [j.id,j])); let add = 0, upd = 0;
  for (const j of incoming){
    const cur = byId.get(j.id);
    if (!cur){ S.journal.push(j); byId.set(j.id,j); add++; }
    else if ((j.upd||0) > (cur.upd||0)){ Object.assign(cur,j); upd++; }
  }
  return {add, upd};
}

async function saveFile(name, data, mime){
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (dl){ try { await dl.save({filename:name, data}); toast("Fichier prêt : " + name); return true; } catch(e){ if (e && e.code !== "declined") toast("Enregistrement impossible"); } return false; }
  try { const file = new File([data], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); toast("Fichier partagé : " + name); return true; } }
  catch(e){ if (e && e.name === "AbortError") return false; }
  const url = URL.createObjectURL(new Blob([data],{type:mime})); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Fichier prêt : " + name); return true;
}

  const mx = Math.max(1, ...pts.map(p => Math.max(p.r, p.d))), H = 110, W = 320, gw = W / 6, bw = 16, cur = pts[5];
  const bars = pts.map((p,i) => { const x = i * gw + gw / 2, hr = Math.round(p.r / mx * H), hd = Math.round(p.d / mx * H);
    return `<rect x="${x - bw - 1}" y="${H - hr + 4}" width="${bw}" height="${hr}" rx="3" fill="var(--accent)"/><rect x="${x + 1}" y="${H - hd + 4}" width="${bw}" height="${hd}" rx="3" fill="var(--warn)"/><text x="${x}" y="${H + 20}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.l}</text>`; }).join("");
  return `<div class="card"><h2>Les 6 derniers mois</h2><svg viewBox="0 0 ${W} ${H + 26}" width="100%" role="img" aria-label="Revenus et dépenses sur 6 mois. ${MOIS[V.m]} : revenus ${eur(cur.r)}, dépenses ${eur(cur.d)}">${bars}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Revenus ${eur(cur.r)}</span><span><i style="background:var(--warn)"></i>Dépenses ${eur(cur.d)}</span></div></div>`;
}
function splitCard(c){
  const parts = c.envs.filter(e => e.dep > 0).map(e => ({n:e.n, v:e.dep})); if (c.ch.prevu > 0) parts.push({n:"Charges fixes", v:c.ch.prevu});
  const tot = parts.reduce((a,p) => a + p.v, 0); if (!tot) return "";
  parts.sort((a,b) => b.v - a.v);
  return `<div class="card"><h2>Où part l'argent</h2><div class="split" role="img" aria-label="Répartition des dépenses du mois">${parts.map(p => `<i style="width:${p.v / tot * 100}%;background:${catColor(p.n)}"></i>`).join("")}</div>
    ${parts.slice(0,6).map(p => `<div class="kv"><span>${dotHtml(p.n,true)}${esc(p.n)}</span><span class="num">${eur(p.v)} <span class="muted small">· ${Math.round(p.v / tot * 100)} %</span></span></div>`).join("")}</div>`;

function periodInfo(){
  const r = periodRange(V.m, V.y), t = todayIso();
  const d0 = new Date(r[0] + "T00:00:00"), d1 = new Date(r[1] + "T00:00:00"), tn = new Date(t + "T00:00:00");
  const total = Math.round((d1 - d0) / 864e5) + 1, done = Math.min(total, Math.max(0, Math.round((tn - d0) / 864e5) + 1));
  const left = t > r[1] ? 0 : Math.max(0, Math.round((d1 - tn) / 864e5));
  const nxt = new Date(d1.getTime() + 864e5);
  return {r, total, done, left, active: t >= r[0] && t <= r[1], pay: frDate(nxt.getFullYear() + "-" + pad(nxt.getMonth()+1) + "-" + pad(nxt.getDate()))};
}
function nextMoves(){
  const out = [], today = new Date(); today.setHours(0,0,0,0);
  for (const [kd, rows] of [["rev", S.fixRev], ["ch", S.fixCh]]) for (const r of rows){
    const st = fixState(r, V.m, V.y); if (st.k === "ok" || !r.jour) continue;
    const dt = fixDate(r.jour, V.m, V.y); if (dt < today) continue;
    out.push({dt, name:r.n, amt:st.amt, sign:kd === "rev" ? 1 : -1}); }
  return out.sort((a,b) => a.dt - b.dt).slice(0,4);
}

function webGone(p){ if (!p.hasId) return []; const present = new Set(p.rows.map(r => r.id).filter(Boolean)); return (S.webSeen || []).filter(id => !present.has(id) && S.web.some(x => x.id === id && !x.del)); }
function applyWeb(replace){
  const p = V.webPending; if (!p) return; let add = 0, upd = 0, gone = 0; const now = Date.now();
  const goneIds = replace ? [] : webGone(p);
  if (replace) S.web.forEach(x => { x.del = true; x.upd = now; });
  const byId = new Map(S.web.map(x => [x.id, x])), byKey = new Map(S.web.filter(x => !x.del).map(x => [webKey(x), x]));
  for (const r of p.rows){ let cur = r.id ? byId.get(r.id) : null; if (!cur) cur = byKey.get(webKey(r));
    if (cur){
      if (r.id && (r.upd || replace)){ if (replace || r.upd >= (cur.upd || 0)){ cur.site = r.site; cur.url = r.url; cur.ident = r.ident; cur.cat = r.cat || cur.cat || "Autre"; if (r.st) cur.st = r.st; cur.note = r.note; cur.del = r.del || undefined; cur.upd = replace ? now : r.upd; upd++; } }
      else if (!cur.del){ for (const k of ["url","cat","st","note"]) if (r[k]) cur[k] = r[k]; cur.upd = now; upd++; } }
    else if (!r.del){ const n = {id:r.id || uid(), site:r.site, url:r.url, ident:r.ident, cat:r.cat || "Autre", st:r.st || "À changer", note:r.note, upd:r.upd || now}; S.web.push(n); byKey.set(webKey(n), n); byId.set(n.id, n); add++; } }
  for (const id of goneIds){ const x = byId.get(id); if (x && !x.del){ x.del = true; x.upd = now; gone++; } }
  if (p.hasId) S.webSeen = p.rows.map(r => r.id).filter(Boolean);
  if (p.cats && p.cats.length) S.webCatList = p.cats;
  V.webMsg = add + " compte(s) ajouté(s), " + upd + " mis à jour" + (gone ? ", " + gone + " supprimé(s) (retirés dans Excel)" : "") + (replace ? " (liste remplacée)." : "."); V.webPending = null; persist(); closeSheet(); render();
}

function wizFinish(){
  collectWiz(); const d = V.wiz.d, n = emptyData(), num = v => parseNum(v) || 0;
  const P = Math.round(num(d.payday)); n.settings.payday = P >= 2 && P <= 28 ? P : 1;

  n.settings.envelopes = d.env.filter(e => e.on && e.n.trim()).map(e => ({n:e.n.trim(), b:num(e.b), m:Array(12).fill(null)}));
  const fx = rows => rows.filter(r => r.n.trim() && num(r.m) > 0).map(r => { const j = parseInt(r.j,10); return {id:uid(), n:r.n.trim(), t:r.t || "", montant:num(r.m), jour:(j >= 1 && j <= 31) ? j : null, m:Array(12).fill("")}; });
  n.fixRev = fx(d.rev); n.fixCh = fx(d.ch);
  if (d.livret.on){ n.settings.livretDepart = num(d.livret.depart); n.epargne.dateDepart = todayIso();
    n.epargne.envA = n.settings.envelopes.some(e => e.n === "Épargne") ? "Épargne" : "";
    n.epargne.poches = d.poches.filter(p => p.n.trim()).map(p => ({id:uid(), n:p.n.trim(), f:num(p.f)})); }
  n.accts = d.accts.filter(a => a.n.trim()).map(a => ({id:uid(), n:a.n.trim(), type:a.type, depart:num(a.depart), date:todayIso(), upd:Date.now()}));
  S = n; V.wiz = null; document.body.classList.remove("wiz"); const cp = curPeriod(); V.m = cp.m; V.y = cp.y; V.tab = "home"; persist(); render(); toast("Appli prête !"); }

/* ============ Nouvelle année : remise à zéro des montants propres à chaque mois ============ */

}

const sum12 = (A, f) => A.months.reduce((t, x) => t + N(f(x)), 0);
function viewHist(){
  const back = `<div class="top"><button class="btn ghost sm" data-act="tab" data-v="set">‹ Réglages</button><div class="app">Historique</div></div>`;
  const AR = S.archives || [];
  if (!AR.length) return back + `<div class="card"><h2>Pas encore d'archive</h2><div class="small muted">À chaque remise à zéro de fin d'année, l'appli fige ici les chiffres des 12 mois de l'année écoulée : revenus, dépenses, épargne, résultat et dépenses par catégorie. La première archive apparaîtra à la fin de la période de décembre.</div></div>`;
  const A = AR.find(a => a.year === V.hy) || AR[0];
  const rev = sum12(A, x => x.revenus), dep = sum12(A, x => x.depenses), epa = sum12(A, x => x.epargne), res = sum12(A, x => x.resultat), fxc = sum12(A, x => x.fixCh);
  const act = A.months.filter(x => N(x.revenus) || N(x.depenses));
  const best = act.slice().sort((a,b) => b.resultat - a.resultat)[0], worst = act.slice().sort((a,b) => a.resultat - b.resultat)[0];
  const cats = {}; A.months.forEach(x => Object.entries(x.cats || {}).forEach(([k,v]) => { cats[k] = (cats[k] || 0) + v; }));
  const parts = Object.entries(cats).concat([["Charges fixes", fxc]]).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const tot = parts.reduce((t,[,v]) => t + v, 0) || 1;
  const bud = {}; A.months.forEach(x => (x.envs || []).forEach(e => { bud[e.n] = (bud[e.n] || 0) + N(e.bud); }));

    ${kv("Dépenses moyennes par mois", eur(dep / (act.length || 1)))}
    ${best ? kv("Meilleur mois", MOIS[best.m] + " (" + eur(best.resultat) + ")") : ""}${worst ? kv("Mois le plus serré", MOIS[worst.m] + " (" + eur(worst.resultat) + ")") : ""}</div>

    <div class="rows">${parts.map(([k,v]) => `<div class="row" style="flex-wrap:wrap"><div class="main"><div class="t">${dotHtml(k,true)}${esc(k)}</div><div class="s">${pct(v)}${bud[k] ? " · budget annuel " + eur(bud[k]) + " (" + Math.round(v / bud[k] * 100) + " % utilisé)" : ""}</div></div><div class="amt num">${eur(v)}</div><div class="bar" style="flex-basis:100%"><i style="width:${Math.min(100, v / tot * 100)}%"></i></div></div>`).join("")}</div></div>
  <div class="card"><h2>Mois par mois</h2><div class="rows">${A.months.map(x => `<div class="row"><div class="main"><div class="t">${MOIS[x.m]}</div><div class="s">Revenus ${eur(x.revenus)} · Dépenses ${eur(x.depenses)}</div></div><div class="amt num ${x.resultat < 0 ? "neg" : "pos"}">${eur(x.resultat)}</div></div>`).join("")}</div></div>

function closeCtx(){ const t = todayIso(), cur = curPeriod(), cc = cutsOf(), d0 = defRange(cur.m,cur.y)[0];

  const recent = cc[ckey(cur.m,cur.y)] && cc[ckey(cur.m,cur.y)] >= isoAdd(t,-5);

  const lines = S.fixRev.map((r,i) => ({r,i})).filter(o => N(o.r.montant) > 0 && o.r.jour && fixDate(o.r.jour,np.m,np.y) >= td0 && o.r.m[np.m] !== "x" && !isNum(o.r.m[np.m]));

  openSheet(`<h2>${id ? "Modifier" : "Nouvelle"} ligne ${k === "rev" ? "de revenu" : "de charge"}</h2>
    <label class="f">Libellé<input id="x-n" value="${esc(r.n)}"></label>
    <label class="f">${k === "rev" ? "Type" : "Famille"}<input id="x-t" value="${esc(r.t)}" placeholder="${k === "rev" ? "Salaire, Allocations…" : "Emprunts, Assurances, Abonnements…"}"></label>
    <div class="grid2"><label class="f">Montant habituel (€)<input id="x-m" inputmode="decimal" value="${r.montant === "" ? "" : String(r.montant).replace(".",",")}"></label>
    <label class="f">Jour du mois<input id="x-j" inputmode="numeric" value="${r.jour || ""}"></label></div>

/* ============ Actions ============ */
function setMonth(d){ V.m += d; if (V.m < 0){ V.m = 11; V.y--; } if (V.m > 11){ V.m = 0; V.y++; } render(); }
function saveOp(){
  collectDraft(); const d = V.draft; const mt = parseNum(d.mont);
  if (!d.date) return toast("Choisissez une date");
  if (!mt || mt <= 0) return toast("Saisissez un montant supérieur à 0");
  const o = {date:d.date,type:d.type,cat:d.type.indexOf("Livret")>=0 ? "" : d.cat,lib:d.lib.trim(),montant:Math.round(mt*100)/100,pointe:d.pt?"x":"",note:d.note,remb:d.type==="Avance (à rembourser)" ? (d.remb||"") : "",upd:Date.now()};
  if (V.editId){ Object.assign(S.journal.find(j => j.id === V.editId), o); toast("Opération modifiée"); }
  else { S.journal.push(Object.assign({id:uid()},o)); toast("Enregistré : " + eur(o.montant)); }
  if (S.demo && !V.editId) { /* l'exemple reste affiché jusqu'à l'import */ }
  { const pp = periodOf(d.date); V.m = pp.m; V.y = pp.y; }
  V.editId = null; V.draft = null; persist(); V.tab = "month"; render();
}
async function onFile(file){
  try {
    if (/\.json$/i.test(file.name)){
      const obj = JSON.parse(await file.text()); if (!obj || !obj.settings || !Array.isArray(obj.journal)) throw new Error("Sauvegarde non reconnue.");
      V.pending = {kind:"json", name:file.name, data:obj, rows:obj.journal};
    } else {
      const wb = XLSX.read(await file.arrayBuffer(),{type:"array",sheets:["Journal","Paramètres","Fixes","Épargne","Mois","Listes","Journal_appli","Reglages_appli","Enveloppes_appli","Fixes_appli","Livret_appli","Poches_appli","Futur_appli","Comptes_epargne_appli","Mouvements_epargne_appli"]});
      const ech = parseEchange(wb);
      if (ech) V.pending = {kind:"echange", name:file.name, rows:ech.rows, full:ech};
      else V.pending = {kind:"classeur", name:file.name, data:parseClasseur(wb)};
    }
    V.msg = ""; render();
  } catch(e){ V.pending = null; V.msg = "Lecture impossible : " + e.message; render(); }
}
function seenOf(p){ const a = p.rows.map(j => j.id); if (p.full && p.full.epargne) for (const m of p.full.epargne.manuel) a.push(m.id); if (p.full && p.full.accts) for (const x of p.full.accts.concat(p.full.acctMv)) a.push(x.id); return a; }
function goneIds(p){ const now = new Set(seenOf(p)), g = new Set(); for (const id of (S.seen || [])) if (!now.has(id)) g.add(id); return g; }
/* Différences Excel -> appli (budgets, fixes, jour de paie) proposées après une fusion */
function diffRef(p){
  const f = p.full || {}, out = [], key = s => String(s).trim().toLowerCase();
  const fm = v => v === "x" ? "pointé" : isNum(v) ? String(v).replace(".",",") + " €" : "vide";
  const em = v => isNum(v) ? String(v).replace(".",",") + " €" : "budget habituel";
  if (f.settings && isNum(f.settings.payday) && f.settings.payday !== payday()){ const v = f.settings.payday;
    out.push({txt:"Jour de paie : " + payday() + " → " + v, ap(){ S.settings.payday = v; const cp = curPeriod(); V.m = cp.m; V.y = cp.y; }}); }
  if (f.settings) for (const x of f.settings.envelopes){
    const e = S.settings.envelopes.find(y => key(y.n) === key(x.n));
    if (!e){ out.push({txt:"Nouvelle enveloppe « " + x.n + " » (" + em(x.b) + ")", ap(){ S.settings.envelopes.push({n:x.n, b:x.b, m:x.m.slice()}); }}); continue; }
    if (N(e.b) !== N(x.b)) out.push({txt:"Enveloppe « " + e.n + " » : budget " + em(N(e.b)) + " → " + em(N(x.b)), ap(){ e.b = x.b; }});
    const ds = []; for (let k=0;k<12;k++){ const a = isNum(e.m[k]) ? e.m[k] : null, b = isNum(x.m[k]) ? x.m[k] : null; if (a !== b) ds.push(k); }
    if (ds.length) out.push({txt:"Enveloppe « " + e.n + " » : " + ds.map(k => MOIS[k].toLowerCase() + " " + em(isNum(e.m[k]) ? e.m[k] : null) + " → " + em(isNum(x.m[k]) ? x.m[k] : null)).join(" ; "), ap(){ for (const k of ds) e.m[k] = isNum(x.m[k]) ? x.m[k] : null; }});
  }
  for (const [kd, arr, lab] of [["rev", f.fixRev, "Revenu"], ["ch", f.fixCh, "Charge"]]){ if (!arr) continue;
    const mine = kd === "rev" ? S.fixRev : S.fixCh;
    const seenN = {};
    for (const x of arr){
      const kn = key(x.n), nth = seenN[kn] = (seenN[kn] || 0) + 1;
      const r = mine.filter(y => key(y.n) === kn)[nth - 1];
      if (!r){ out.push({txt:"Nouveau fixe (" + lab.toLowerCase() + ") « " + x.n + " » : " + eur(x.montant), ap(){ mine.push(Object.assign({}, x, {id:uid(), m:x.m.slice()})); }}); continue; }
      if (N(r.montant) !== N(x.montant) || (r.jour || null) !== (x.jour || null) || String(r.t || "") !== String(x.t || ""))
        out.push({txt:lab + " « " + r.n + " » : " + eur(N(r.montant)) + (r.jour ? " le " + r.jour : "") + " → " + eur(N(x.montant)) + (x.jour ? " le " + x.jour : ""), ap(){ r.montant = x.montant; r.jour = x.jour; r.t = x.t; }});
      const ds = []; for (let k=0;k<12;k++){ const a = r.m[k] === undefined ? "" : r.m[k], b = x.m[k]; if (String(a) !== String(b)) ds.push(k); }
      if (ds.length) out.push({txt:lab + " « " + r.n + " » : " + ds.map(k => MOIS[k].toLowerCase() + " " + fm(r.m[k]) + " → " + fm(x.m[k])).join(" ; "), ap(){ for (const k of ds) r.m[k] = x.m[k]; }});
    } }
  return out;
}
function sheetDiff(){
  const d = V.diff || []; if (!d.length) return;
  openSheet(`<h2>Différences avec Excel</h2><div class="small muted">Excel contient des budgets ou des fixes différents de ceux de l'appli. Décochez ce que vous ne voulez pas reprendre (par exemple un pointage fait depuis, dans l'appli, après l'export).</div>
    ${d.map((x,i) => `<label class="f" style="flex-direction:row;gap:10px;align-items:flex-start"><input type="checkbox" data-df="${i}" checked style="width:auto;margin-top:3px"><span class="small">${esc(x.txt)}</span></label>`).join("")}
    <div class="btns"><button class="btn" data-act="df-apply" style="flex:1">Reprendre la sélection</button><button class="btn ghost" data-act="df-skip">Garder l'appli</button></div>`);
}
function commitImport(replace){
  const p = V.pending; if (!p) return;
 const keepWeb = S.web || [], keepSeen = S.webSeen, keepCats = S.webCatList, keepBank = S.bank, keepRules = S.rules, keepLB = S.lastBackup, keepAc = S.accts, keepMvv = S.acctMv, keepArch = S.archives, keepYR = S.yearRecap, keepFY = S.fixYear, keepCuts = S.cuts, keepLC = S.lastClose;
  const prevPay = S.settings.payday; if (replace && p.kind === "classeur"){ const prevCats = S.settings.cats; S = p.data; S.demo = false; if (!S.settings.cats.length) S.settings.cats = prevCats; V.msg = "Données remplacées par le classeur."; }
  else if (replace && p.kind === "echange"){ const f = p.full; const base = emptyData();
    S = Object.assign(base,{journal:p.rows}); if (f.settings) S.settings = f.settings; if (f.fixRev) S.fixRev = f.fixRev; if (f.fixCh) S.fixCh = f.fixCh; if (f.epargne) S.epargne = f.epargne; if (f.accts){ S.accts = f.accts; S.acctMv = f.acctMv; }
    if (/^export_appli/i.test(p.name)) S.seen = seenOf(p);
    V.msg = "Données remplacées par le fichier d'échange."; }
  else if (replace && p.kind === "json"){ S = p.data; S.demo = false; V.msg = "Sauvegarde restaurée."; }
  else {
    const rows = p.kind === "classeur" ? p.data.journal : p.rows;
    if (S.demo){ S.journal = []; S.fixRev = []; S.fixCh = []; S.settings.envelopes = []; S.demo = false; }
    const fromExcel = p.kind === "echange" && /^export_appli/i.test(p.name), gone = fromExcel ? goneIds(p) : null;
    const r = mergeJournal(rows); V.msg = r.add + " ligne(s) ajoutée(s), " + r.upd + " mise(s) à jour.";
    if (p.kind === "echange" && p.full.epargne){ const byId = new Map(S.epargne.manuel.map(m => [m.id, m])); let a = 0, u = 0;
      for (const m of p.full.epargne.manuel){ const c = byId.get(m.id);
        if (!c){ S.epargne.manuel.push(m); byId.set(m.id, m); a++; } else if ((m.upd || 0) > (c.upd || 0)){ Object.assign(c, m); u++; } }
      V.msg += " Livret A : " + a + " ajoutée(s), " + u + " mise(s) à jour."; }
    if (p.kind === "echange" && p.full.accts){ let a = 0, u = 0; S.accts = S.accts || []; S.acctMv = S.acctMv || [];
      const mergeBy = (mine, inc) => { const by = new Map(mine.map(x => [x.id, x])); for (const x of inc){ const c = by.get(x.id); if (!c){ mine.push(x); by.set(x.id, x); a++; } else if ((x.upd || 0) > (c.upd || 0)){ Object.assign(c, x); u++; } } };
      mergeBy(S.accts, p.full.accts); mergeBy(S.acctMv, p.full.acctMv); V.msg += " Comptes d'épargne : " + a + " ajouté(s), " + u + " mis à jour."; }
    if (fromExcel){ let d = 0, now = Date.now();
      for (const x of (S.accts || []).concat(S.acctMv || [])) if (!x.del && gone.has(x.id)){ x.del = true; x.upd = now; d++; }
      for (const j of S.journal) if (!j.del && gone.has(j.id)){ j.del = true; j.upd = now; d++; }
      for (const m of S.epargne.manuel) if (!m.del && gone.has(m.id)){ m.del = true; m.upd = now; d++; }
      if (d) V.msg += " " + d + " ligne(s) supprimée(s) dans Excel retirée(s) ici.";
      S.seen = seenOf(p); }
  }
  if (replace && S.settings && S.settings.payday === undefined && prevPay !== undefined) S.settings.payday = prevPay;
  if (replace && p.kind !== "json"){ S.web = keepWeb; S.webSeen = keepSeen; S.webCatList = keepCats; S.bank = keepBank; S.rules = keepRules; S.lastBackup = keepLB; S.archives = keepArch; S.yearRecap = keepYR; if (keepFY !== undefined) S.fixYear = keepFY; if (keepCuts) S.cuts = keepCuts; if (keepLC) S.lastClose = keepLC; if (!(p.kind === "echange" && p.full.accts)){ S.accts = keepAc || []; S.acctMv = keepMvv || []; } }
  V.diff = (!replace && p.kind === "echange") ? diffRef(p) : null;
  V.pending = null; migrate(); persist(); render();
  if (V.diff && V.diff.length) sheetDiff();
}

  try { V.bkMsg = "Lecture du relevé…"; render();

    if (/\.pdf$/i.test(file.name)) parsed = await parsePdfReleve(buf); else parsed = parseCsvReleve(XLSX.read(new TextDecoder("utf-8").decode(buf),{type:"string"}));
    V.bk = reconcile(parsed); V.bk.name = file.name; V.bkMsg = "";
  } catch(e){ V.bk = null; V.bkMsg = "Lecture impossible : " + e.message; }
  render();
}
function bkRow(o, sub){ return `<div class="row"><div class="main"><div class="t">${esc(cleanLib(o.lib))}</div><div class="s">${frDate(o.d)}${sub ? " · " + sub : ""}</div></div><div class="amt num ${o.cred ? "pos" : "neg"}">${o.cred ? "+ " : "− "}${eur(o.a)}</div></div>`; }
function viewBank(){
  const B = V.bk, back = `<div class="top"><button class="btn ghost sm" data-act="tab" data-v="set">‹ Réglages</button><div class="app">Rapprochement</div></div>`;
  if (!B) return back + (V.bkMsg ? `<div class="info ${/impossible/.test(V.bkMsg) ? "bad" : ""}">${esc(V.bkMsg)}</div>` : "") + `<div class="card"><h2>Relevé de banque</h2>
    <div class="small muted">Choisissez le relevé de votre compte (PDF ou CSV). L'appli compare avec votre journal et vous propose les changements. Rien n'est modifié avant « Appliquer », et vous pourrez annuler.</div>
    <label class="f">Relevé<input id="bkfile" type="file" accept=".pdf,.csv,.txt"></label></div>
    <div class="card"><h2>Comment ça marche ?</h2><div class="hbody small"><p><b>À quoi ça sert ?</b> À vérifier que ton journal correspond à ton relevé de banque : rien d'oublié, rien de faux. Les opérations retrouvées sont pointées pour toi.</p>
    <p><b>Comment faire :</b></p>
    <p>1. Dans l'appli ou sur le site de ta banque, télécharge le <b>relevé de compte</b> du mois (PDF, ou fichier CSV / Excel).</p>
    <p>2. Ici, touche <b>Importer un relevé</b> et choisis le fichier.</p>
    <p>3. L'appli te montre ce qu'elle a trouvé : les opérations <b>déjà dans ton journal</b> (elle propose de les pointer : même montant, date à 4 jours près), les <b>fixes retrouvés</b> (salaire, loyer… pointés dans « Fixes »), et celles qui sont <b>absentes du journal</b> (tu choisis l'enveloppe pour les créer, « Ignorer », ou tu décides plus tard).</p>
    <p>4. Rien ne change avant d'appuyer sur <b>Appliquer</b>. Après, tu peux <b>annuler le dernier rapprochement</b> dans Réglages.</p>
    <p><b>Et ma vie privée ?</b> Le fichier est lu sur ton téléphone : il n'est ni envoyé, ni conservé. L'appli ne retient ni ton nom, ni ton adresse, ni ton IBAN, ni ton numéro de compte : elle ne lit que les lignes d'opérations (date, libellé, montant) et le solde. Les opérations que tu choisis de créer deviennent des lignes de ton journal avec le libellé de la banque, qui peut contenir un nom de personne (un virement reçu, par exemple). L'appli garde aussi un repère de chaque opération (date, montant, début du libellé) pour ne pas la compter deux fois. Tout reste sur ton téléphone, mais se retrouve dans ta sauvegarde .json et ton export Excel : ne les partage pas.</p>
    <p><b>Conseil :</b> fais-le de temps en temps, par exemple une fois par mois.</p></div></div>`;
  const all = S.settings.envelopes.map(e => e.n).concat(S.settings.cats.filter(c => !S.settings.envelopes.some(e => e.n === c)));
  const c = bkCounts(B), before = calc(V.m, V.y).d18, after = bkSim(B);
  const sel = (r, i) => { const opts = r.o.cred ? ["Remboursement"] : all, fxs = (r.o.cred ? S.fixRev : S.fixCh).slice().sort((a,b) => a.n.localeCompare(b.n, "fr"));
    return `<select data-bk="${i}" aria-label="Enveloppe"><option value="" ${r.choice === "" ? "selected" : ""}>À classer…</option><option value="__ignore" ${r.choice === "__ignore" ? "selected" : ""}>Ignorer</option>${fxs.length ? `<optgroup label="C'est un fixe…">${fxs.map(f => `<option value="fx:${r.o.cred ? "rev" : "ch"}:${f.id}" ${r.choice === "fx:" + (r.o.cred ? "rev" : "ch") + ":" + f.id ? "selected" : ""}>${esc(f.n)} (${eur(N(f.montant))})</option>`).join("")}</optgroup>` : ""}<optgroup label="Enveloppe">${opts.map(o => `<option ${o === r.choice ? "selected" : ""}>${esc(o)}</option>`).join("")}</optgroup></select>`; };
  return back + `<div class="card"><h2>${esc(B.name)}</h2>
    <div class="kv"><span>Opérations lues</span><span class="num">${B.total}</span></div>
    <div class="kv"><span>Déjà importées avant</span><span class="num">${B.skip.length}</span></div>
    <div class="kv"><span>Déjà pointées dans le journal</span><span class="num">${B.done.length}</span></div>
    <div class="kv"><span>À pointer</span><span class="num">${B.point.length}</span></div>
    <div class="kv"><span>Fixes retrouvés</span><span class="num">${B.fix.length}</span></div>
    <div class="kv"><span>Absentes du journal</span><span class="num">${B.create.length}</span></div>
    ${B.solde !== null ? `<div class="kv"><span>Solde du relevé au ${frDate(B.soldeDate)}</span><span class="num">${eur(B.solde)}</span></div>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="bk-solde" ${B.useSolde ? "checked" : ""}> Mettre à jour mon solde banque</label>` : ""}</div>
  <div class="card"><h2>Pointer (${B.point.length})</h2><div class="small muted">Lignes du journal retrouvées sur le relevé (même montant, date à 4 jours près).</div>
    <div class="rows">${B.point.length ? B.point.map((r,i) => `<div class="row"><button class="chk ${r.on ? "on" : ""}" data-act="bk-pt" data-i="${i}" aria-label="Pointer">${ICON.check}</button>
      <div class="main"><div class="t">${esc(r.j.lib || r.j.cat || r.j.type)}</div><div class="s">${frDate(r.o.d)} · banque : ${esc(cleanLib(r.o.lib))}</div></div><div class="amt num">${eur(r.o.a)}</div></div>`).join("") : '<div class="empty">Rien à pointer.</div>'}</div></div>
  ${B.fix.length ? `<div class="card"><h2>Fixes retrouvés (${B.fix.length})</h2><div class="small muted">Ces opérations correspondent à un revenu ou une charge fixe : elles sont pointées dans « Fixes », sans créer de ligne au journal. Si le montant diffère, le montant réel est saisi pour le mois.</div>
    <div class="rows">${B.fix.map((r,i) => `<div class="row"><button class="chk ${r.on ? "on" : ""}" data-act="bk-fx" data-i="${i}" aria-label="Pointer">${ICON.check}</button>
      <div class="main"><div class="t">${esc(r.f.n)}</div><div class="s">${frDate(r.o.d)} · banque : ${esc(cleanLib(r.o.lib))}${Math.abs(N(r.f.montant) - r.o.a) > .005 ? " · prévu " + eur(N(r.f.montant)) : ""}</div></div><div class="amt num ${r.o.cred ? "pos" : "neg"}">${r.o.cred ? "+ " : "− "}${eur(r.o.a)}</div></div>`).join("")}</div></div>` : ""}
  <div class="card"><h2>Absentes du journal (${B.create.length})</h2><div class="small muted">Choisissez une enveloppe pour créer la ligne, « C'est un fixe… » pour le pointer dans vos fixes, « Ignorer » pour la laisser de côté, ou laissez « À classer » pour décider plus tard.</div>
    <div class="rows">${B.create.length ? B.create.map((r,i) => `<div class="row" style="flex-wrap:wrap"><div class="main" style="min-width:55%"><div class="t">${esc(cleanLib(r.o.lib))}</div><div class="s">${frDate(r.o.d)}${r.internal ? " · virement interne" : ""}</div></div><div class="amt num ${r.o.cred ? "pos" : "neg"}">${r.o.cred ? "+ " : "− "}${eur(r.o.a)}</div><div style="flex-basis:100%">${sel(r,i)}</div></div>`).join("") : '<div class="empty">Tout est déjà dans le journal.</div>'}</div></div>
  <div class="card"><h2>Avant d'appliquer</h2>
    <div class="kv"><span>Reste à vivre (${MOIS[V.m]})</span><span class="num">${eur(before)} → ${after === null ? "—" : eur(after)}</span></div>
    <div class="small muted">${c.pt} pointée(s), ${c.fx} fixe(s), ${c.cr} créée(s), ${c.ig} ignorée(s), ${c.left} laissée(s) de côté.</div>
    <div class="btns"><button class="btn" data-act="bk-apply" style="flex:1" ${c.pt + c.fx + c.cr + c.ig === 0 ? "disabled" : ""}>Appliquer</button><button class="btn ghost" data-act="bk-cancel">Annuler</button></div></div>`;
}

/* ============ Démarrage ============ */
const migrate = () => { if (!S.epargne) S.epargne = emptyEpargne(); if (!Array.isArray(S.accts)) S.accts = []; if (!Array.isArray(S.acctMv)) S.acctMv = []; if (!Array.isArray(S.web)) S.web = []; if (!S.bank) S.bank = {seen:[]}; if (!S.rules) S.rules = {}; if (!V.pinit){ const cp = curPeriod(); V.m = cp.m; V.y = cp.y; V.pinit = true; } };
function applyTheme(){ const t = lsGet("mc-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme();
function startApp(){
  S = load();
  if (!S || !S.settings){ S = emptyData(); V.wiz = wizInit(); }
  migrate(); render(); yearCheck();
}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
secCfgLoad();
faceOK().then(v => { V.faceOK = v; });
if (secAvailable() && lsGet(ENC)){ SEC.on = true; showLock(); } else startApp();
/* iOS : recale les éléments fixes (barre d'onglets, feuilles) après reprise, rotation ou clavier */
(function(){ const fix = () => { try { const n = document.querySelector("nav.tabs"); if (n){ n.style.display = "none"; void n.offsetHeight; n.style.display = ""; } window.scrollTo(window.scrollX, window.scrollY); } catch(e){} };
  window.addEventListener("pageshow", fix); window.addEventListener("orientationchange", () => setTimeout(fix, 300)); window.addEventListener("resize", () => setTimeout(fix, 150));
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ setTimeout(fix, 100); setTimeout(() => { try { yearCheck(); } catch(e){} }, 400); } });
  document.addEventListener("focusout", () => setTimeout(fix, 250)); })();
</script>
